[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Rebuild daily so new podcast episodes from the Podbean feed appear automatically.
# Set up a Netlify build hook + scheduled function (or Zapier) to trigger it.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
